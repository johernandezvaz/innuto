[package]
name = "innuto"
version = "0.1.0"
edition = "2021"
description = "Innuto: an open DJ library manager, track analyzer, and two-deck player"
license = "MIT"

[workspace]
members = ["app/src-tauri"]

[lib]
name = "innuto"
path = "src/lib.rs"

[[bin]]
name = "innuto"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
cpal = "0.15"
dirs = "5"
hound = "3.5"
midir = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
symphonia = { version = "0.5", features = ["all"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[profile.dev.package."*"]
opt-level = 2
