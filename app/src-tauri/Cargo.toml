[package]
name = "innuto-app"
version = "0.1.0"
description = "innuto desktop app"
edition = "2021"
license = "MIT"

[[bin]]
name = "innuto-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
innuto = { path = "../.." }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
